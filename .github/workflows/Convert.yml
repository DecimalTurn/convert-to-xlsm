name: Convert to modern XLSM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: windows-2025
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
      - name: "Setup VBA Runtime"
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: "Excel"
          install-office: "true"
      - name: "Convert to XLSM"
        shell: pwsh
        run: |
          ./scripts/Convert-ToXlsm.ps1 -InputDir "./input" -OutputDir "./output"
      - name: "Upload Converted Files"
        uses: actions/upload-artifact@v4
        with:
          name: "XLSM-Files"
          path: "./output/*.xlsm"
          if-no-files-found: warn
      - name: "Upload Screenshots"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "Screenshots"
          path: "./screenshots/*.png"
          if-no-files-found: ignore







